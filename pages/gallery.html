<!DOCTYPE html>
<html lang="uk" id="gallery-page">
<head>
    <meta charset="UTF-8">
    <title>Галерея моїх улюбленців</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="gallery-body">
    <header id="header">
        <h2 class="page-title">Галерея моїх улюбленців</h2>
    </header>
    <main id="content">
        <section class="gallery">
            <figure class="gallery-item" id="alita">
                <img src="../photo/alita.jpg" alt="Кішка Аліта" width="300">
                <figcaption class="caption">Аліта</figcaption>
            </figure>
            <figure class="gallery-item" id="hamon">
                <img src="../photo/hamon.jpg" alt="Хом'ячок Хамон" width="300">
                <figcaption class="caption">Хамон</figcaption>
            </figure>
            <figure class="gallery-item" id="pampushka">
                <img src="../photo/pampushka.jpg" alt="Хом'ячок Пампушка" width="300">
                <figcaption class="caption">Пампушка</figcaption>
            </figure>
            <figure class="gallery-item" id="soni">
                <img src="../photo/soni.jpg" alt="Африканські соні" width="300">
                <figcaption class="caption">Соні</figcaption>
            </figure>
        </section>
        <nav id="navigation">
            <a href="../index.html" class="nav-link">Головна</a>
        </nav>
    </main>
    <footer id="footer">
        <p class="footer-text">© 2025 Україна</p>
    </footer>

</html>
